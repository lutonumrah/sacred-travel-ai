{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Keeps reset-link tokens away from other sites. Not "no-referrer": that makes #}
  {# browsers send "Origin: null" on these forms' POSTs, which CSRF rejects. #}
  <meta name="referrer" content="same-origin">
  <title>{% block title %}Sign in{% endblock %} · Scared Travel AI</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-panel">
      <div class="blank-badge">Scared Travel AI OS</div>
      {% block panel %}{% endblock %}
    </div>
  </div>
</body>
</html>

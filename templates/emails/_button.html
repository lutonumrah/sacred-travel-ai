{% comment %}A bulletproof link button. Context: url, label, brand_color.{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:20px 0;">
  <tr>
    <td style="border-radius:8px;background:{{ brand_color }};">
      <a href="{{ url }}" style="display:inline-block;padding:12px 22px;color:#ffffff;font-weight:600;text-decoration:none;border-radius:8px;">{{ label }}</a>
    </td>
  </tr>
</table>
<p style="font-size:12px;color:#6b7280;word-break:break-all;margin:0 0 12px;">Or open this link: <a href="{{ url }}" style="color:{{ brand_color }};">{{ url }}</a></p>

services:
  web:
    build: .
    image: scared-travel-ai:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - sqlite_data:/app/data
      - static_files:/app/staticfiles
      - media_files:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Follow-up reminders, chat auto-resume and the nightly SQLite backup.
  # Same image as web (deploy.sh builds it once for both); it never migrates —
  # it starts only after web, which did, reports healthy.
  scheduler:
    image: scared-travel-ai:latest
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      SKIP_BOOT_TASKS: "1"
    command: ["python", "manage.py", "run_scheduled_jobs", "--loop", "--interval", "60"]
    volumes:
      - sqlite_data:/app/data
      - media_files:/app/media
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      # The loop touches this file after every run.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/scheduler-heartbeat') > 300)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Only DOMAIN is substituted, so nginx's own $host/$scheme survive envsubst.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      NGINX_ENVSUBST_FILTER: "DOMAIN"
    volumes:
      - ./docker/nginx/app.conf.template:/etc/nginx/templates/app.conf.template:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # A custom command bypasses the image's template step (it only fires when
    # argv[0] is "nginx"), so envsubst is invoked explicitly here. The 6h loop
    # reloads nginx so a renewed certificate is picked up without a restart.
    command: >
      /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf;
      /docker-entrypoint.d/20-envsubst-on-templates.sh;
      while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

volumes:
  sqlite_data:
  static_files:
  media_files:
  certbot_conf:
  certbot_www:

# Browser smoke suite. Deliberately outside `manage.py test`: this directory has
# no __init__.py and no test*.py files, so Django's discovery never sees it.
[pytest]
python_files = smoke_*.py
python_functions = test_*
testpaths = .
addopts = -p no:cacheprovider -ra
markers =
    desktop_only: needs a mouse-driven desktop browser
    mobile_only: only meaningful on a phone-sized, emulated mobile device
